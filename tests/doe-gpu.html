<!doctype html><html lang="en"><meta charset="UTF-8"><title>DOE production optical GPU regression</title><pre id="result">Running DOE production optical kernel…</pre><script type="module">
import * as THREE from 'three/webgpu';
import { createThreeInterop } from '../src/rendering/three-interop.js';
import { runOpticalPathProbe } from './optical-path-probe.js';
const out=document.querySelector('#result');
if(document.visibilityState!=='visible'||!document.hasFocus()) {
  out.textContent='Waiting for visible, focused Safari content before starting validation…';
  await new Promise(resolve=>{
    const ready=()=>{if(document.visibilityState==='visible'&&document.hasFocus()){removeEventListener('focus',ready);document.removeEventListener('visibilitychange',ready);resolve();}};
    addEventListener('focus',ready);document.addEventListener('visibilitychange',ready);ready();
  });
}
const report={userAgent:navigator.userAgent,startedAt:new Date().toISOString(),visibility:document.visibilityState,focused:document.hasFocus(),errors:[]};
let renderer,interop;
try {
  renderer=new THREE.WebGPURenderer();await renderer.init();interop=createThreeInterop(renderer);
  interop.device.addEventListener('uncapturederror',e=>report.errors.push(e.error.message));
  Object.assign(report,await runOpticalPathProbe(interop));
  if(report.errors.length)throw new Error('Uncaptured GPU errors');
} catch(error) {report.passed=false;report.error=error.stack||String(error);}
finally {
  report.finishedAt=new Date().toISOString();report.finishedVisibility=document.visibilityState;report.finishedFocused=document.hasFocus();
  out.textContent=JSON.stringify(report,null,2);document.body.dataset.passed=String(report.passed);
  await fetch('/__doe_report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(report,null,2)}).catch(()=>{});
  interop?.dispose();renderer?.dispose();
}
</script></html>
